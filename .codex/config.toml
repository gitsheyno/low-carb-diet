#:schema https://developers.openai.com/codex/config-schema.json

# Strong general-purpose default for implementation, debugging, and review.
# A CLI or per-thread model selection can still override this when needed.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
personality = "pragmatic"

# Keep routine repository work autonomous while requiring approval before
# commands need access beyond the workspace sandbox.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Use current search results when Codex needs external, time-sensitive facts.
web_search = "live"

[sandbox_workspace_write]
network_access = false

